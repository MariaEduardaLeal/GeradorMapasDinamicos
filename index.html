<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>RPG World - Ciclo Dia/Noite e Clima</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        #info {
            position: absolute; top: 20px; left: 20px;
            color: white; background: rgba(0, 0, 0, 0.8);
            padding: 20px; border-radius: 12px;
            pointer-events: none; display: none;
            border-left: 4px solid #d4af37;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            min-width: 200px; backdrop-filter: blur(4px);
        }
        
        #instructions {
            position: absolute; bottom: 20px; left: 20px;
            color: rgba(255,255,255,0.9); background: rgba(0, 0, 0, 0.6); 
            padding: 10px 20px; border-radius: 30px;
            font-size: 0.9em; pointer-events: none;
            border: 1px solid rgba(255,255,255,0.2);
        }

        #time-display {
            position: absolute; top: 20px; right: 20px;
            color: #fff; font-weight: bold; background: rgba(0,0,0,0.5);
            padding: 10px; border-radius: 8px; font-family: monospace;
            border: 1px solid rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <div id="info">
        <h2 id="cityName" style="margin: 0 0 10px 0; color: #d4af37; font-size: 1.5em;">Nome</h2>
        <p>População: <span id="cityPop" style="font-weight:bold;">0</span></p>
        <p>Tipo: <span id="cityType">Vila</span></p>
    </div>

    <div id="time-display">Hora: 00:00</div>

    <div id="instructions">
        Botão Esquerdo: Girar | Scroll: Zoom | <b>F5: Gerar Novo Mundo</b>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { createNoise2D } from 'https://unpkg.com/simplex-noise@4.0.1/dist/esm/simplex-noise.js';

        // --- Configuração Básica ---
        const scene = new THREE.Scene();
        // A cor do fundo será dinâmica, não definimos fixa aqui
        scene.fog = new THREE.Fog(0x87CEEB, 100, 450);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 60, 90);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;

        const clock = new THREE.Clock(); 
        const noise2D = createNoise2D();

        // --- SISTEMA DE ILUMINAÇÃO (SOL E LUA) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2); // Luz base fraca
        scene.add(ambientLight);

        // Sol (Luz Direcional)
        const sunLight = new THREE.DirectionalLight(0xffeeb1, 1.5);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        // Aumentar a área da sombra para cobrir o mapa todo enquanto o sol gira
        sunLight.shadow.camera.left = -100;
        sunLight.shadow.camera.right = 100;
        sunLight.shadow.camera.top = 100;
        sunLight.shadow.camera.bottom = -100;
        scene.add(sunLight);

        // Representação Visual do Sol
        const sunGeo = new THREE.SphereGeometry(4, 16, 16);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xFFFF00 });
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        scene.add(sunMesh);

        // Representação Visual da Lua
        const moonGeo = new THREE.SphereGeometry(3, 16, 16);
        const moonMat = new THREE.MeshBasicMaterial({ color: 0xDDDDFF });
        const moonMesh = new THREE.Mesh(moonGeo, moonMat);
        scene.add(moonMesh);

        // Configurações do Ciclo
        const DAY_DURATION = 600; // 600 segundos = 10 minutos (5 dia / 5 noite)
        
        // Cores do Céu (Skybox)
        const SKY_COLORS = {
            day: new THREE.Color(0x87CEEB),
            sunset: new THREE.Color(0xFF4500), // Laranja Avermelhado
            night: new THREE.Color(0x050510)   // Quase preto
        };

        // --- GERAÇÃO DO MUNDO ---
        const worldSize = 140;
        const resolution = 150; 
        const seedX = Math.random() * 5000;
        const seedZ = Math.random() * 5000;
        const stormSeedX = Math.random() * 5000 + 10000; 
        const stormSeedZ = Math.random() * 5000 + 10000;

        // -- TERRENO --
        const geometry = new THREE.PlaneGeometry(worldSize, worldSize, resolution, resolution);
        geometry.rotateX(-Math.PI / 2);
        const vertices = geometry.attributes.position;
        const colors = [];
        
        const C_DEEP = new THREE.Color(0x00008B);
        const C_WATER = new THREE.Color(0x1E90FF);
        const C_SAND = new THREE.Color(0xE6C288);
        const C_GRASS = new THREE.Color(0x228B22);
        const C_ROCK = new THREE.Color(0x696969);
        const C_SNOW = new THREE.Color(0xFFFFFF);

        for (let i = 0; i < vertices.count; i++) {
            const x = vertices.getX(i);
            const z = vertices.getZ(i);
            let elevation = noise2D((x + seedX) * 0.02, (z + seedZ) * 0.02);
            elevation += noise2D((x + seedX) * 0.06, (z + seedZ) * 0.06) * 0.5;
            elevation *= 8; 
            vertices.setY(i, elevation);
            let c;
            if (elevation < -2.0) c = C_DEEP;
            else if (elevation < 0.2) c = C_WATER;
            else if (elevation < 1.5) c = C_SAND;
            else if (elevation < 5.5) c = C_GRASS;
            else if (elevation < 8.5) c = C_ROCK;
            else c = C_SNOW;
            colors.push(c.r, c.g, c.b);
        }
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geometry.computeVertexNormals();
        const terrainMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.8 });
        const terrain = new THREE.Mesh(geometry, terrainMaterial);
        terrain.receiveShadow = true;
        scene.add(terrain);

        // -- ÁGUA --
        const waterGeometry = new THREE.PlaneGeometry(worldSize, worldSize, resolution, resolution);
        waterGeometry.rotateX(-Math.PI / 2);
        const waterMaterial = new THREE.MeshStandardMaterial({
            color: 0x1E90FF, transparent: true, opacity: 0.75,
            roughness: 0.1, metalness: 0.6, flatShading: true
        });
        const water = new THREE.Mesh(waterGeometry, waterMaterial);
        water.position.y = 0.2; 
        scene.add(water);

        // -- NUVENS DINÂMICAS --
        const clouds = [];
        const cloudGeo = new THREE.BoxGeometry(1, 1, 1);
        
        function criarNuvem() {
            const cloudGroup = new THREE.Group();
            
            // Define se é nuvem de chuva (20% de chance)
            const isRain = Math.random() < 0.2;
            const color = isRain ? 0x555555 : 0xffffff;
            const mat = new THREE.MeshStandardMaterial({ 
                color: color, 
                transparent: true, 
                opacity: 0.9,
                flatShading: true 
            });

            // Cria "flocos" de nuvem aglomerados
            const flocos = Math.floor(Math.random() * 5) + 3;
            for(let i=0; i<flocos; i++) {
                const mesh = new THREE.Mesh(cloudGeo, mat);
                mesh.position.set(
                    (Math.random() - 0.5) * 3,
                    (Math.random() - 0.5) * 1.5,
                    (Math.random() - 0.5) * 2
                );
                mesh.scale.set(
                    Math.random() * 2 + 1,
                    Math.random() * 1.5 + 1,
                    Math.random() * 2 + 1
                );
                cloudGroup.add(mesh);
            }

            // Posição inicial aleatória
            cloudGroup.position.set(
                (Math.random() - 0.5) * worldSize * 1.5,
                Math.random() * 10 + 20, // Altura entre 20 e 30
                (Math.random() - 0.5) * worldSize * 1.5
            );

            // Velocidade aleatória
            cloudGroup.userData = {
                speed: Math.random() * 0.05 + 0.02,
                isRain: isRain
            };

            scene.add(cloudGroup);
            clouds.push(cloudGroup);
        }

        // Criar 30 nuvens
        for(let i=0; i<30; i++) criarNuvem();


        // -- CIDADES --
        const cities = [];
        const cityGeometry = new THREE.CylinderGeometry(0.2, 0.6, 1.5, 4);
        const cityMaterial = new THREE.MeshStandardMaterial({ color: 0x8B0000 });
        const prefixos = ["Port", "São", "Fort", "Nova", "Val", "Grand"];
        const sufixos = ["grad", "mouth", "keep", "ia", "dor", "rock"];

        for(let i = 0; i < 50; i++) { 
            const x = (Math.random() - 0.5) * (worldSize - 10);
            const z = (Math.random() - 0.5) * (worldSize - 10);
            let h = noise2D((x + seedX) * 0.02, (z + seedZ) * 0.02);
            h += noise2D((x + seedX) * 0.06, (z + seedZ) * 0.06) * 0.5;
            h *= 8;
            if (h > 1.5 && h < 5.0) {
                const city = new THREE.Mesh(cityGeometry, cityMaterial);
                city.position.set(x, h + 0.75, z);
                city.castShadow = true;
                city.userData = {
                    name: prefixos[Math.floor(Math.random()*prefixos.length)] + " " + sufixos[Math.floor(Math.random()*sufixos.length)],
                    pop: Math.floor(Math.random() * 5000) + 100,
                    type: Math.random() > 0.5 ? "Vila Comercial" : "Forte Militar"
                };
                scene.add(city);
                cities.push(city);
                if(cities.length >= 12) break; 
            }
        }

        // -- Interação --
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const infoDiv = document.getElementById('info');

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cities);
            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                document.getElementById('cityName').innerText = data.name;
                document.getElementById('cityPop').innerText = data.pop;
                document.getElementById('cityType').innerText = data.type;
                infoDiv.style.display = 'block';
            } else {
                infoDiv.style.display = 'none';
            }
        });

        // --- ANIMAÇÃO PRINCIPAL ---
        function animate() {
            requestAnimationFrame(animate);

            const totalTime = clock.getElapsedTime();
            const positionAttribute = water.geometry.attributes.position;
            
            // 1. ÁGUA E TEMPESTADES
            for ( let i = 0; i < positionAttribute.count; i ++ ) {
                const x = positionAttribute.getX( i );
                const z = positionAttribute.getZ( i );
                let stormNoise = noise2D((x + stormSeedX) * 0.04, (z + stormSeedZ) * 0.04);
                let stormIntensity = stormNoise > 0.3 ? (stormNoise - 0.3) * 2.0 : 0;
                let finalHeight = 0.2 + (stormIntensity * 1.5);
                let finalSpeed = 1.0 + (stormIntensity * 2.0);

                const y = Math.sin( x * 0.3 + totalTime * finalSpeed + stormNoise * 5 ) * finalHeight 
                        + Math.cos( z * 0.2 + totalTime * finalSpeed ) * (finalHeight * 0.5);
                positionAttribute.setY( i, y );
            }
            positionAttribute.needsUpdate = true;
            water.geometry.computeVertexNormals();

            // 2. CICLO DIA/NOITE (10 min = 600s)
            // Normaliza o tempo para um ciclo de 0 a 1
            const cycleTime = (totalTime % DAY_DURATION) / DAY_DURATION; 
            const angle = cycleTime * Math.PI * 2; // 0 a 2PI (círculo completo)

            // Movimento Circular do Sol e Lua (Raio 100)
            const sunX = Math.cos(angle) * 100;
            const sunY = Math.sin(angle) * 100;
            
            sunMesh.position.set(sunX, sunY, 0);
            sunLight.position.copy(sunMesh.position);
            
            // Lua no oposto exato
            moonMesh.position.set(-sunX, -sunY, 0);

            // --- LÓGICA DE CORES DO CÉU ---
            // Usamos o seno da altura (Y) para saber "quão alto" está o sol
            const sunHeight = Math.sin(angle); // 1 = Meio dia, 0 = Por do sol, -1 = Meia noite

            let targetColor;
            let fogColor;
            let lightIntensity;

            if (sunHeight > 0.2) { 
                // DIA CLARO
                targetColor = SKY_COLORS.day;
                fogColor = 0x87CEEB; // Azul claro
                lightIntensity = 1.5;
            } else if (sunHeight > -0.2) { 
                // ENTARDECER / AMANHECER (Zona de Transição)
                // Interpolação suave para laranja
                targetColor = SKY_COLORS.sunset;
                fogColor = 0xFF4500; // Laranja
                lightIntensity = 0.5;
            } else {
                // NOITE
                targetColor = SKY_COLORS.night;
                fogColor = 0x050510; // Preto azulado
                lightIntensity = 0.0; // O sol apaga
            }

            // Aplicar mudanças suaves (Lerp)
            scene.background = scene.background || new THREE.Color();
            scene.background.lerp(targetColor, 0.01);
            
            scene.fog.color.lerp(new THREE.Color(fogColor), 0.01);
            
            // Intensidade da luz solar
            sunLight.intensity = THREE.MathUtils.lerp(sunLight.intensity, lightIntensity, 0.01);
            
            // Se for noite, liga uma luz ambiente azulada (Luar)
            const ambientTarget = sunHeight < 0 ? 0.3 : 0.6; // Noite = 0.3, Dia = 0.6
            ambientLight.intensity = THREE.MathUtils.lerp(ambientLight.intensity, ambientTarget, 0.01);
            if(sunHeight < 0) ambientLight.color.setHex(0x5555AA); // Tom azulado
            else ambientLight.color.setHex(0xFFFFFF); // Tom branco

            // Atualiza display de hora (Fictício)
            const gameHour = Math.floor(cycleTime * 24);
            const gameMin = Math.floor((cycleTime * 24 * 60) % 60);
            document.getElementById('time-display').innerText = 
                `Hora: ${gameHour.toString().padStart(2,'0')}:${gameMin.toString().padStart(2,'0')}`;

            // 3. ANIMAÇÃO DAS NUVENS
            clouds.forEach(cloud => {
                cloud.position.x += cloud.userData.speed;
                // Se sair do mapa, volta para o começo (Wrap around)
                if(cloud.position.x > worldSize) {
                    cloud.position.x = -worldSize;
                    cloud.position.z = (Math.random() - 0.5) * worldSize; // Muda a posição Z tbm pra variar
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
