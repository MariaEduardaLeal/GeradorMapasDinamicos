<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Mapa RPG - Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none; /* Deixa o clique passar para o mapa */
            display: none; /* Escondido por padrão */
            border: 2px solid #d4af37;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info">
        <h2 id="cityName" style="margin-top: 0;">Nome da Cidade</h2>
        <p>População: <span id="cityPop">0</span></p>
        <p>Tipo: <span id="cityType">Vila</span></p>
    </div>

    <div id="instructions">
        Botão Esquerdo: Girar | Scroll: Zoom | Clique na cidade para ver detalhes
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { createNoise2D } from 'https://unpkg.com/simplex-noise@4.0.1/dist/esm/simplex-noise.js';

        // --- Configuração Básica ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Cor do céu
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 40, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- Luzes ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(50, 50, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- Controles (Zoom e Rotação) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- Gerador de Terreno ---
        const noise2D = createNoise2D(); // Inicializa o gerador de ruído
        
        // Parâmetros do Mapa
        const worldWidth = 100;
        const worldDepth = 100;
        const geometry = new THREE.PlaneGeometry(worldWidth, worldDepth, 100, 100);
        geometry.rotateX(-Math.PI / 2); // Deita o plano

        const vertices = geometry.attributes.position;
        const colors = [];
        const colorAttribute = new THREE.BufferAttribute(new Float32Array(vertices.count * 3), 3);

        // Definição de Cores por Altura (Hex codes)
        const DEEP_WATER = new THREE.Color(0x00008B);
        const WATER = new THREE.Color(0x1E90FF);
        const SAND = new THREE.Color(0xE6C288);
        const GRASS = new THREE.Color(0x228B22);
        const ROCK = new THREE.Color(0x696969);
        const SNOW = new THREE.Color(0xFFFFFF);

        // Modifica a altura dos vértices baseado no Noise
        for (let i = 0; i < vertices.count; i++) {
            const x = vertices.getX(i);
            const z = vertices.getZ(i);
            
            // Frequência do ruído (quanto maior, mais "áspero")
            // Amplitude (quanto maior, mais altas as montanhas)
            let elevation = noise2D(x * 0.05, z * 0.05) * 4; 
            elevation += noise2D(x * 0.1, z * 0.1) * 2; // Detalhes menores
            
            // Define a altura Y
            vertices.setY(i, elevation);

            // Define a cor baseada na altura
            let color;
            if (elevation < -1.5) color = DEEP_WATER;
            else if (elevation < 0.2) color = WATER;
            else if (elevation < 1.0) color = SAND;
            else if (elevation < 3.5) color = GRASS;
            else if (elevation < 5.5) color = ROCK;
            else color = SNOW;

            colors.push(color.r, color.g, color.b);
        }

        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geometry.computeVertexNormals(); // Recalcula iluminação para as novas alturas

        const material = new THREE.MeshStandardMaterial({ 
            vertexColors: true, // Importante para usar as cores que definimos
            roughness: 0.8,
            flatShading: true // Estilo Low Poly
        });

        const terrain = new THREE.Mesh(geometry, material);
        terrain.receiveShadow = true;
        scene.add(terrain);

        // --- Adicionar Água (Plano Transparente) ---
        const waterGeo = new THREE.PlaneGeometry(worldWidth, worldDepth);
        waterGeo.rotateX(-Math.PI / 2);
        const waterMat = new THREE.MeshStandardMaterial({
            color: 0x1E90FF,
            transparent: true,
            opacity: 0.6
        });
        const waterPlane = new THREE.Mesh(waterGeo, waterMat);
        waterPlane.position.y = 0.2; // Nível do mar
        scene.add(waterPlane);

        // --- Gerador de Cidades ---
        const cities = [];
        const cityGeometry = new THREE.ConeGeometry(0.5, 2, 4); // Cidades são cones/torres
        const cityMaterial = new THREE.MeshStandardMaterial({ color: 0xFF0000 });

        // Gerador de Nomes Aleatórios
        const prefixos = ["Val", "Mor", "Grim", "Ar", "Fell", "Storm", "Iron"];
        const sufixos = ["grad", "heim", "dor", "ia", "ford", "keep", "wood"];
        
        function gerarNome() {
            const p = prefixos[Math.floor(Math.random() * prefixos.length)];
            const s = sufixos[Math.floor(Math.random() * sufixos.length)];
            return p + s;
        }

        // Tenta colocar 10 cidades
        for(let i = 0; i < 10; i++) {
            const x = (Math.random() - 0.5) * (worldWidth - 10);
            const z = (Math.random() - 0.5) * (worldDepth - 10);
            
            // Descobre a altura do terreno naquele ponto (aproximada)
            // Nota: Para precisão exata precisaria de Raycaster para baixo, mas usando o noise resolve
            let elevation = noise2D(x * 0.05, z * 0.05) * 4; 
            elevation += noise2D(x * 0.1, z * 0.1) * 2;

            // Só constrói se for grama (acima da água e areia, abaixo da pedra)
            if (elevation > 1.2 && elevation < 3.5) {
                const city = new THREE.Mesh(cityGeometry, cityMaterial);
                city.position.set(x, elevation + 1, z); // +1 para ficar em cima do chão
                city.castShadow = true;
                
                // Dados da cidade (Meta-dados)
                city.userData = {
                    name: gerarNome(),
                    population: Math.floor(Math.random() * 5000) + 100,
                    type: Math.random() > 0.5 ? "Fortaleza" : "Vila Comercial"
                };

                scene.add(city);
                cities.push(city);
            }
        }

        // --- Interação (Raycaster) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const infoDiv = document.getElementById('info');

        window.addEventListener('click', (event) => {
            // Calcula posição do mouse normalizada (-1 a +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Vê se clicou em alguma cidade
            const intersects = raycaster.intersectObjects(cities);

            if (intersects.length > 0) {
                const cityData = intersects[0].object.userData;
                
                // Atualiza HTML
                document.getElementById('cityName').innerText = cityData.name;
                document.getElementById('cityPop').innerText = cityData.population;
                document.getElementById('cityType').innerText = cityData.type;
                infoDiv.style.display = 'block';
                
                // Pequena animação na cidade clicada
                intersects[0].object.material.color.setHex(0xFFFF00); // Fica amarela
                setTimeout(() => {
                    intersects[0].object.material.color.setHex(0xFF0000); // Volta ao vermelho
                }, 500);
            } else {
                infoDiv.style.display = 'none';
            }
        });

        // --- Loop de Animação ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Responsividade
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
