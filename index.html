<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>RPG World Modular</title>
    <link rel="stylesheet" href="style.css">
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "simplex-noise": "https://unpkg.com/simplex-noise@4.0.1/dist/esm/simplex-noise.js"
            }
        }
    </script>
</head>
<body>

    <div id="controls-ui">
        <button class="rpg-btn" id="btnSave">💾 Salvar</button>
        <button class="rpg-btn" id="btnLoad">📂 Carregar</button>
        <button class="rpg-btn" id="btnNew" style="margin-top: 10px;">🎲 Novo Mundo</button>
    </div>
    
    <input type="file" id="fileInput" style="display: none;" accept=".json">

    <div id="info">
        <h2 id="cityName">Nome</h2>
        <p>População: <span id="cityPop">0</span></p>
        <p>Tipo: <span id="cityType">Vila</span></p>
    </div>

    <div id="time-display">Hora: 00:00</div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
