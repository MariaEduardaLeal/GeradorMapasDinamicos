<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Continentes RPG</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #info {
            position: absolute; top: 20px; left: 20px;
            color: white; background: rgba(0, 0, 0, 0.8);
            padding: 15px; border-radius: 8px;
            pointer-events: none; display: none;
            border: 2px solid #d4af37;
            min-width: 200px;
        }
        #instructions {
            position: absolute; bottom: 20px; left: 20px;
            color: white; background: rgba(0, 0, 0, 0.6); padding: 10px;
            pointer-events: none; border-radius: 4px;
        }
        #seed-display {
            position: absolute; top: 20px; right: 20px;
            color: #d4af37; font-weight: bold; background: rgba(0,0,0,0.5);
            padding: 5px 10px; border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="info">
        <h2 id="cityName" style="margin-top: 0; color: #d4af37;">Nome</h2>
        <p>População: <span id="cityPop" style="color: #eee;">0</span></p>
        <p>Tipo: <span id="cityType" style="color: #eee;">Vila</span></p>
        <p style="font-size: 0.8em; margin-top: 10px; color: #aaa;"><i>Clique fora para fechar</i></p>
    </div>

    <div id="seed-display">Gerando nova história...</div>

    <div id="instructions">
        Botão Esquerdo: Girar | Scroll: Zoom | F5: Novo Mundo
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { createNoise2D } from 'https://unpkg.com/simplex-noise@4.0.1/dist/esm/simplex-noise.js';

        // --- Configuração da Cena ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x203040); // Azul mais escuro/profundo
        scene.fog = new THREE.Fog(0x203040, 100, 400); // "Fumaça" do mundo

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 50, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.1; // Impede a câmera de entrar no chão

        // --- Luzes ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffddaa, 1.2); // Luz solar levemente alaranjada
        dirLight.position.set(50, 80, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- Geração de Terreno Procedural ---
        const noise2D = createNoise2D();
        
        // !IMPORTANTE: Isso garante mapas únicos a cada reload
        const seedX = Math.random() * 10000; 
        const seedZ = Math.random() * 10000;
        document.getElementById('seed-display').innerText = `Mundo ID: ${Math.floor(seedX)}-${Math.floor(seedZ)}`;

        const worldSize = 120;
        const resolution = 150; // Mais vértices para curvas mais suaves
        const geometry = new THREE.PlaneGeometry(worldSize, worldSize, resolution, resolution);
        geometry.rotateX(-Math.PI / 2);

        const vertices = geometry.attributes.position;
        const colors = [];

        // Cores (Hex)
        const C_DEEP = new THREE.Color(0x001133);
        const C_WATER = new THREE.Color(0x1E90FF);
        const C_SAND = new THREE.Color(0xE6C288);
        const C_GRASS = new THREE.Color(0x2E8B57); // SeaGreen
        const C_FOREST = new THREE.Color(0x006400); // DarkGreen
        const C_ROCK = new THREE.Color(0x696969);
        const C_SNOW = new THREE.Color(0xFFFAFA);

        for (let i = 0; i < vertices.count; i++) {
            const x = vertices.getX(i);
            const z = vertices.getZ(i);

            // --- A MÁGICA DOS CONTINENTES ---
            // Camada 1: O "Formato do Continente" (Frequência muito baixa: 0.015)
            // Usamos o seedX/Z para pegar um lugar aleatório do universo matemático
            let noiseBase = noise2D((x + seedX) * 0.015, (z + seedZ) * 0.015);
            
            // Camada 2: Detalhes e relevo (Frequência média: 0.05)
            let noiseDetail = noise2D((x + seedX) * 0.06, (z + seedZ) * 0.06) * 0.3;

            // Camada 3: Textura rochosa (Frequência alta: 0.15)
            let noiseRoughness = noise2D((x + seedX) * 0.15, (z + seedZ) * 0.15) * 0.1;

            // Soma tudo
            let elevation = noiseBase + noiseDetail + noiseRoughness;

            // Potencialização: Torna vales mais fundos e picos mais altos
            // Isso ajuda a definir bem a separação Terra vs Mar
            let finalHeight = elevation * 8; 

            // Aplicar altura ao vértice
            vertices.setY(i, finalHeight);

            // Colorização baseada na altura final
            let c;
            if (finalHeight < -3) c = C_DEEP;
            else if (finalHeight < 0.5) c = C_WATER;      // Nível do mar um pouco mais alto
            else if (finalHeight < 1.8) c = C_SAND;       // Praias
            else if (finalHeight < 4.5) c = C_GRASS;      // Planícies
            else if (finalHeight < 7.0) c = C_FOREST;     // Florestas altas
            else if (finalHeight < 10.0) c = C_ROCK;      // Montanhas
            else c = C_SNOW;                              // Picos

            colors.push(c.r, c.g, c.b);
        }

        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geometry.computeVertexNormals();

        const material = new THREE.MeshStandardMaterial({ 
            vertexColors: true, 
            roughness: 0.9,
            flatShading: true // Low Poly look
        });

        const terrain = new THREE.Mesh(geometry, material);
        terrain.receiveShadow = true;
        scene.add(terrain);

        // --- Água ---
        const waterGeo = new THREE.PlaneGeometry(worldSize, worldSize);
        waterGeo.rotateX(-Math.PI / 2);
        const waterMat = new THREE.MeshStandardMaterial({
            color: 0x1E90FF, transparent: true, opacity: 0.7,
            roughness: 0.1, metalness: 0.5
        });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.position.y = 0.5; // Altura da água
        scene.add(water);

        // --- Cidades Inteligentes ---
        const cities = [];
        const cityMarkers = new THREE.Group();
        scene.add(cityMarkers);

        function criarCidade() {
            // Tenta 50 vezes achar um lugar bom, se não conseguir, desiste (evita loop infinito)
            for(let attempt = 0; attempt < 50; attempt++) {
                const x = (Math.random() - 0.5) * (worldSize - 10);
                const z = (Math.random() - 0.5) * (worldSize - 10);

                // Recalcula a altura neste ponto exato usando a MESMA fórmula do terreno
                let n1 = noise2D((x + seedX) * 0.015, (z + seedZ) * 0.015);
                let n2 = noise2D((x + seedX) * 0.06, (z + seedZ) * 0.06) * 0.3;
                let n3 = noise2D((x + seedX) * 0.15, (z + seedZ) * 0.15) * 0.1;
                let h = (n1 + n2 + n3) * 8;

                // Regra: Só constrói na grama ou floresta (entre areia e pedra)
                if (h > 2.0 && h < 6.0) {
                    const geo = new THREE.BoxGeometry(0.8, h/2 + 2, 0.8); // Altura varia
                    const mat = new THREE.MeshStandardMaterial({ color: 0x8B0000 }); // Vermelho escuro
                    const city = new THREE.Mesh(geo, mat);
                    
                    city.position.set(x, h + 1, z);
                    city.castShadow = true;

                    // Metadados RPG
                    city.userData = {
                        name: gerarNomeCidade(),
                        pop: Math.floor(Math.random() * 8000) + 500,
                        type: h > 5 ? "Forte da Montanha" : "Vila dos Campos"
                    };

                    cityMarkers.add(city);
                    cities.push(city);
                    return; // Sucesso, sai da função
                }
            }
        }

        // Gerador de Nomes RPG
        function gerarNomeCidade() {
            const syl1 = ["Kor", "Dal", "Vor", "Cae", "Syl", "Mor", "Gar"];
            const syl2 = ["vash", "ia", "dor", "mon", "thas", "grad", "wen"];
            return syl1[Math.floor(Math.random()*syl1.length)] + syl2[Math.floor(Math.random()*syl2.length)];
        }

        // Tentar criar 15 cidades
        for(let k=0; k<15; k++) criarCidade();

        // --- Interação ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const info = document.getElementById('info');

        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const hits = raycaster.intersectObjects(cities);
            if(hits.length > 0) {
                const data = hits[0].object.userData;
                document.getElementById('cityName').innerText = data.name;
                document.getElementById('cityPop').innerText = data.pop;
                document.getElementById('cityType').innerText = data.type;
                info.style.display = 'block';
                
                // Feedback visual
                hits[0].object.scale.set(1.5, 1.5, 1.5);
                setTimeout(() => hits[0].object.scale.set(1, 1, 1), 200);
            } else {
                info.style.display = 'none';
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
